name: test-python

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/python.yaml'
      - 'src/nanoarrow/**'
      - 'python/**'

env:
  FORCE_COLOR: 1

permissions:
  contents: read

jobs:
  test-python:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
          - '3.15'
          - '3.15t'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install nanoarrow
        run: |
          pushd python
          pip install -U pip
          if [[ "${{ matrix.python-version }}" == "3.13" ]]; then
            pip install -r requirements-stubs.txt 'meson>=1.3.0' meson-python
            pip install --no-build-isolation . --group test
          elif [[ "${{ matrix.python-version }}" == *t ]]; then
            pip install . --group test-parallel
          else
            pip install . --group test
          fi
          popd
          pip list

      - name: Run tests
        if: ${{ !endsWith(matrix.python-version, 't') }}
        run: |
          pytest python/tests -v -s

      - name: Run tests (free-threaded)
        if: ${{ endsWith(matrix.python-version, 't') }}
        run: |
          # None of nanoarrow's modules should re-enable the GIL
          python -c "import sys, pkgutil, importlib, nanoarrow; [importlib.import_module(m.name) for m in pkgutil.iter_modules(nanoarrow.__path__, 'nanoarrow.')]; assert not sys._is_gil_enabled()"
          pytest python/tests -v --parallel-threads=auto --iterations=3

      - name: Check generated type stubs
        if: matrix.python-version == '3.13'
        run: |
          bash python/generate_type_stubs.sh
          stubs='python/src/nanoarrow/*.pyi'
          changes=$(git status --porcelain -- "$stubs")
          if [[ -n "$changes" ]]; then
            git diff -- "$stubs"
            printf '%s\n' "$changes"
            exit 1
          fi
          mypy --follow-imports=silent python/src/nanoarrow/*.pyi

      - name: Run doctests
        if: success() && matrix.python-version == '3.13'
        run: |
          pytest --pyargs nanoarrow --doctest-modules

  # Make sure we can build a source distribution and install from it
  python-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install packaging tools
        run: |
          pip install --upgrade pip
          pip install build twine

      - name: Build
        run: |
          cd python
          python -m build --sdist --wheel

      - name: Check install from sdist
        run: |
          pip install python/dist/nanoarrow-*.tar.gz
          python -c "import nanoarrow; print(nanoarrow.__version__)"
          pip uninstall --yes nanoarrow

      - name: Check install from wheel
        run: |
          pip install python/dist/nanoarrow-*.whl
          python -c "import nanoarrow; print(nanoarrow.__version__)"
          pip uninstall --yes nanoarrow

      - name: Run twine check
        run: |
          twine check --strict python/dist/*
